ekf_filter_node:
  ros__parameters:
    frequency: 30.0 
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom
    odom0_config: [false, false, false, #x,y,z position
                   false, false, false, #r,p,y orientation
                   true, true, false,    #x,y,z velocity
                   false, false, true, #r,p,y velocity
                   false, false, false] #x,y,z acceleration
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false, 
                  false, false, false,
                  false, false, true, #yaw velocity
                  true, true, false]  #x,y acceleration
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10

    imu0_remove_gravitational_acceleration: true